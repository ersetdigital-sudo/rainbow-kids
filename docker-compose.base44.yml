services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "Rainbow Kids"
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - base44_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - NEXT_TELEMETRY_DISABLED=1
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- -H 0.0.0.0 -p 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: on-failure

volumes:
  base44_node_modules:
