function salePaid(s){return s.payments.reduce((a,p)=>a+p.amt,0)}

 <div class="card"><div class="p-4"><input class="max-w-xs" placeholder="Cari produk / varian" value="${esc(q)}" oninput="state.pq=this.value;rerender()"></div><div class="tw"><table class="t"><thead><tr><th>Produk</th><th>Varian</th><th>Kategori</th><th class="r">Stok</th><th class="r">Harga modal</th><th class="r">Harga jual</th><th class="r">Margin</th><th></th></tr></thead><tbody>${list.map(v=>`<tr><td class="font-semibold">${esc(v.pname)}</td><td>${esc(v.name)}</td><td style="color:var(--mu)">${esc(v.cat)}</td><td class="r"><span class="bd ${v.stock<10?'b-er':v.stock<15?'b-wa':'b-ok'}">${v.stock}</span></td><td class="r num">${rp(v.cost)}</td><td class="r num">${rp(v.price)}</td><td class="r num">${Math.round((v.price-v.cost)/v.price*100)}%</td><td class="r"><button class="btn s" onclick="vHistory('${v.id}')">Riwayat</button> <button class="btn s" onclick="changeReq('${v.id}')">Ubah</button></td></tr>`).join('')}</tbody></table></div></div>`};

function productForm(){modal('Produk baru',`<div class="grid sm:grid-cols-2 gap-3"><div><label class="f">Kategori (bebas)</label><input id="nc" list="cats" placeholder="mis. Sepatu"><datalist id="cats">${[...new Set(D.products.map(p=>p.cat))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div><div><label class="f">Nama produk</label><input id="nn" placeholder="mis. Sepatu Anak LED"></div></div><div class="mt-4 font-bold text-sm mb-2">Varian</div><div id="vrows" class="space-y-2"></div><button class="btn s mt-2" onclick="addVRow()">+ Tambah varian</button>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" onclick="saveProduct()">Simpan produk</button>`);addVRow()}

PAGES.purch=(arg)=>{if(arg==='new')setTimeout(()=>purchForm(),0);const sp=state.sup||'',d1=state.pd1||'',d2=state.pd2||'';
 const list=D.purchases.filter(p=>(!sp||p.supplier===sp)&&(!d1||p.date>=d1)&&(!d2||p.date<=d2)).slice().reverse();
 const tot=p=>p.items.reduce((a,i)=>a+i.qty*i.cost,0);const sups=[...new Set(D.purchases.map(p=>p.supplier))];
 const rek=sups.map(s=>{const a=list.filter(p=>p.supplier===s);return{s,n:a.length,t:a.reduce((x,p)=>x+tot(p),0)}}).filter(r=>r.n);
 return head('Pembelian Supplier','Catat pembelian sesuai nota/struk. Stok bertambah otomatis dan bisa ditelusuri saat stok opname.',`<button class="btn p" onclick="purchForm()">+ Catat pembelian</button>`)+
 `<div class="card p-4 flex flex-wrap gap-2 items-end mb-4"><div><label class="f">Supplier</label><select onchange="state.sup=this.value;route()"><option value="">Semua supplier</option>${sups.map(s=>`<option ${sp===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div><label class="f">Dari</label><input type="date" value="${d1}" onchange="state.pd1=this.value;route()"></div><div><label class="f">Sampai</label><input type="date" value="${d2}" onchange="state.pd2=this.value;route()"></div><button class="btn" onclick="state.sup=state.pd1=state.pd2='';route()">Reset</button></div>

 <div class="card p-5"><div class="font-bold mb-3">Rekap per supplier</div>${rek.map(r=>`<div class="flex justify-between py-2.5 border-b text-[13px]" style="border-color:#EEF1F6"><div><div class="font-semibold">${esc(r.s)}</div><div class="text-xs" style="color:var(--mu)">${r.n} nota</div></div><div class="num font-semibold">${rp(r.t)}</div></div>`).join('')}<div class="flex justify-between pt-3 font-bold"><span>Total periode</span><span class="num">${rp(rek.reduce((a,r)=>a+r.t,0))}</span></div>
 <div class="mt-4 p-3 rounded-lg text-xs" style="background:var(--inb);color:var(--in)"><b>Disiapkan untuk:</b> utang supplier (tempo, jatuh tempo, cicilan). Kolom status pembayaran sudah tersedia di setiap nota.</div></div></div>`};
let pdraft;
function purchForm(){pdraft={supplier:'',nota:'',date:TODAY,items:[{vid:'v1',qty:10,cost:V('v1').cost}],updateCost:false};drawPurch()}
function drawPurch(){const sups=[...new Set(D.purchases.map(p=>p.supplier))];
 modal('Catat pembelian dari nota',`<div class="sim mb-4">Tip: salin isi nota/struk baris per baris. Foto nota bisa dilampirkan pada versi produksi.</div><div class="grid sm:grid-cols-3 gap-3"><div><label class="f">Supplier</label><input list="sl" value="${esc(pdraft.supplier)}" onchange="pdraft.supplier=this.value" placeholder="Nama supplier"><datalist id="sl">${sups.map(s=>`<option>${esc(s)}</option>`).join('')}</datalist></div><div><label class="f">No. nota / struk</label><input value="${esc(pdraft.nota)}" onchange="pdraft.nota=this.value"></div><div><label class="f">Tanggal nota</label><input type="date" value="${pdraft.date}" onchange="pdraft.date=this.value"></div></div>
 <div class="mt-5 mb-2 font-bold text-sm">Daftar barang</div><div class="space-y-2">${pdraft.items.map((it,i)=>`<div class="grid grid-cols-12 gap-2 items-end"><div class="col-span-12 sm:col-span-6"><label class="f">Barang / varian</label><select onchange="pdraft.items[${i}].vid=this.value;pdraft.items[${i}].cost=V(this.value).cost;drawPurch()">${vOpts(it.vid)}</select></div><div class="col-span-3 sm:col-span-2"><label class="f">Qty</label><input type="number" value="${it.qty}" oninput="pdraft.items[${i}].qty=+this.value;calcPurch()"></div><div class="col-span-7 sm:col-span-3"><label class="f">Harga satuan</label><input type="number" value="${it.cost}" oninput="pdraft.items[${i}].cost=+this.value;calcPurch()"></div><div class="col-span-2 sm:col-span-1"><button class="btn s d w-full justify-center" onclick="pdraft.items.splice(${i},1);drawPurch()" ${pdraft.items.length<2?'disabled':''}>✕</button></div></div>`).join('')}</div>
 <button class="btn s mt-2" onclick="pdraft.items.push({vid:'v4',qty:10,cost:V('v4').cost});drawPurch()">+ Tambah barang</button><div id="pcalc" class="mt-5 rounded-xl p-4" style="background:#F5F7FB"></div>`,
 `<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" onclick="savePurch()">Simpan & tambah stok</button>`);calcPurch()}
function calcPurch(){const t=pdraft.items.reduce((a,i)=>a+i.qty*i.cost,0);const diff=pdraft.items.filter(i=>i.cost!==V(i.vid).cost);
 $('#pcalc').innerHTML=`<div class="flex justify-between font-bold text-base"><span>Total pembelian</span><span class="num">${rp(t)}</span></div>${diff.length?`<div class="text-xs mt-2" style="color:var(--wa)">${diff.length} barang punya harga satuan berbeda dari harga modal saat ini. Perubahan harga modal akan diajukan ke approval.</div>`:''}`}
function savePurch(){if(!pdraft.supplier.trim()||!pdraft.nota.trim())return toast('Isi supplier dan no. nota');
 const p={id:'PB-'+String(D.purchases.length+1).padStart(3,'0'),nota:pdraft.nota,supplier:pdraft.supplier,date:pdraft.date,items:pdraft.items.map(i=>({...i})),payStatus:'Lunas'};
 p.items.forEach(i=>{const v=V(i.vid);v.stock+=i.qty;D.history.push({vid:i.vid,date:p.date,type:'Stok',desc:`Pembelian ${p.id} (${p.nota}) +${i.qty}`,user:D.user});
  if(i.cost!==v.cost)D.approvals.push({id:'AP-'+String(D.approvals.length+1).padStart(3,'0'),type:'Harga modal',vid:i.vid,field:'cost',before:v.cost,after:i.cost,user:D.user,time:TODAY+' '+new Date().toTimeString().slice(0,5),status:'Menunggu',ref:p.id})});
 D.purchases.push(p);save();closeModal();toast('Pembelian '+p.id+' tersimpan, stok bertambah');route()}
function purchDetail(id){const p=D.purchases.find(x=>x.id===id);const av=allV();const tot=p.items.reduce((a,i)=>a+i.qty*i.cost,0),qty=p.items.reduce((a,i)=>a+i.qty,0);
 const R=(a,b,c='')=>`<div class="flex justify-between gap-3 py-1.5 ${c}"><span style="color:var(--mu)">${a}</span><span class="num text-right">${b}</span></div>`;
 const H=(ic,t,x='')=>`<div class="sdh"><span class="sdi">${ic}</span><span>${t}</span>${x?`<span class="ml-auto font-semibold" style="color:var(--nv)">${x}</span>`:''}</div>`;
 const I={t:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',b:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>',s:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/></svg>'};
 modal('Detail Pembelian Supplier',`<div class="sdtop"><div><div class="text-xs" style="color:var(--mu)">No. Pembelian</div><div class="font-extrabold text-lg" style="color:var(--nv)">${p.id}</div></div><span class="bd b-ok">Stok masuk</span></div>
 <div class="sdc">${H(I.t,'Supplier')}<div class="font-bold">${esc(p.supplier)}</div><div class="text-[13px] mt-0.5" style="color:var(--mu)">Nota supplier ${esc(p.nota)} · ${fd(p.date)}</div></div>
 <div class="sdc">${H(I.b,'Barang Diterima',qty+' unit')}${p.items.map(i=>{const v=av.find(x=>x.id===i.vid)||{};const nm=v.pname||vlabel(i.vid);const mg=v.price?Math.round((v.price-i.cost)/v.price*100):null;return`<div class="sdp"><div class="sdth">${esc((nm||'?').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div class="flex-1 min-w-0"><div class="font-bold text-[14px]" style="color:var(--nv)">${esc(nm)}</div><div class="text-[12.5px]" style="color:var(--mu)">${esc(v.name||'')}${v.cat?' · '+esc(v.cat):''}</div><div class="text-[12.5px] mt-1" style="color:var(--mu)">${i.qty} × ${rp(i.cost)}${v.price?' · jual '+rp(v.price):''}</div></div><div class="text-right"><div class="font-bold num whitespace-nowrap" style="color:var(--nv)">${rp(i.qty*i.cost)}</div></div></div>`}).join('')}
 <div class="text-[13px] mt-2 pt-2 border-t" style="border-color:var(--ln)">${R('Jumlah item',p.items.length+' barang')}${R('Total unit',qty+' unit')}</div>
 <div class="sdtot"><span>Total Pembelian</span><span class="num">${rp(tot)}</span></div></div>
 <div class="text-[13px] px-1">${R('No. Pembelian','<b style="color:var(--nv)">'+p.id+'</b>')}${R('No. Nota supplier','<b style="color:var(--nv)">'+esc(p.nota)+'</b>')}${R('Tanggal pembelian','<b style="color:var(--nv)">'+fd(p.date)+'</b>')}</div>`,`<button class="btn p" onclick="closeModal()">Tutup</button>`)}

PAGES.opname=()=>head('Stok Opname','Bandingkan stok sistem dengan hitungan fisik. Penyesuaian baru berlaku setelah disetujui Owner.',`<button class="btn p" onclick="opnameNew()">+ Mulai opname</button>`)+
 `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 mb-5">${['1. Mulai sesi','2. Input stok fisik','3. Isi penyebab selisih','4. Owner menyetujui'].map((s,i)=>`<div class="card p-3 sm:p-4 flex gap-3 items-center"><div class="w-8 h-8 flex-none rounded-full grid place-items-center font-bold text-sm" style="background:var(--acs);color:var(--ac2)">${i+1}</div><div class="text-[13px] font-semibold">${s.slice(3)}</div></div>`).join('')}</div>
 <div class="card"><div class="tw"><table class="t"><thead><tr><th>No.</th><th>Tanggal</th><th class="r">Item</th><th class="r">Item selisih</th><th class="r">Nilai selisih</th><th>Status</th><th></th></tr></thead><tbody>${D.opnames.slice().reverse().map(o=>{const dl=o.lines.filter(l=>l.phys!==''&&l.phys!==l.sys);const val=o.lines.reduce((a,l)=>a+((l.phys===''?l.sys:l.phys)-l.sys)*V(l.vid).cost,0);return`<tr class="cl" onclick="opnameOpen('${o.id}')"><td class="font-semibold">${o.id}</td><td>${fd(o.date)}</td><td class="r">${o.lines.length}</td><td class="r">${dl.length}</td><td class="r num" style="color:${val<0?'var(--er)':'inherit'}">${rp(val)}</td><td>${bd(o.status)}</td><td class="r"><span class="btn s">${o.status==='Draft'?'Lanjutkan':'Lihat'}</span></td></tr>`}).join('')}</tbody></table></div></div>`;
function opnameNew(){const o={id:'SO-'+String(D.opnames.length+1).padStart(3,'0'),date:TODAY,status:'Draft',lines:allV().map(v=>({vid:v.id,sys:v.stock,phys:'',note:''}))};D.opnames.push(o);save();route();opnameOpen(o.id)}
function opnameOpen(id){const o=D.opnames.find(x=>x.id===id);const ed=o.status==='Draft';
 const lastP=vid=>{const ps=D.purchases.filter(p=>p.items.some(i=>i.vid===vid));const p=ps[ps.length-1];return p?`${p.id} · ${fd(p.date)} · +${p.items.find(i=>i.vid===vid).qty}`:'-'};
 modal(`Stok opname ${o.id} · ${fd(o.date)}`,`${ed?'<div class="sim mb-3">Isi stok fisik hasil hitung. Kosongkan jika belum dihitung (dianggap sesuai).</div>':''}<div class="tw"><table class="t"><thead><tr><th>Barang</th><th>Pembelian terakhir</th><th class="r">Sistem</th><th class="r">Fisik</th><th class="r">Selisih</th><th>Penyebab</th></tr></thead><tbody>${o.lines.map((l,i)=>`<tr><td class="font-semibold">${esc(vlabel(l.vid))}</td><td class="text-xs" style="color:var(--mu)">${lastP(l.vid)}</td><td class="r">${l.sys}</td><td class="r">${ed?`<input type="number" class="w-20 text-right" value="${l.phys}" oninput="opLine('${id}',${i},this.value)">`:(l.phys===''?l.sys:l.phys)}</td><td class="r font-semibold" id="df${i}">${dfTxt(l)}</td><td>${ed?`<select class="w-40" onchange="D.opnames.find(x=>x.id==='${id}').lines[${i}].note=this.value;save()"><option value="">—</option>${['Rusak','Hilang','Salah input','Sampel / display','Kadaluarsa','Lainnya'].map(n=>`<option ${l.note===n?'selected':''}>${n}</option>`).join('')}</select>`:esc(l.note||'-')}</td></tr>`).join('')}</tbody></table></div><div id="opsum" class="mt-4"></div>`,
 ed?`<button class="btn" onclick="closeModal()">Simpan draft</button><button class="btn p" onclick="opSubmit('${id}')">Ajukan persetujuan</button>`:o.status==='Menunggu'?`<button class="btn d" onclick="opDecide('${id}',false)">Tolak</button><button class="btn p" onclick="opDecide('${id}',true)">Setujui & sesuaikan stok</button>`:`<span class="text-sm mr-auto" style="color:var(--mu)">${o.status} oleh ${esc(o.by||'-')}</span><button class="btn p" onclick="closeModal()">Tutup</button>`);opSum(id)}
function dfTxt(l){if(l.phys==='')return'<span style="color:var(--mu)">0</span>';const d=l.phys-l.sys;return`<span style="color:${d<0?'var(--er)':d>0?'var(--ok)':'var(--mu)'}">${d>0?'+':''}${d}</span>`}
function opLine(id,i,val){const o=D.opnames.find(x=>x.id===id);o.lines[i].phys=val===''?'':+val;save();$('#df'+i).innerHTML=dfTxt(o.lines[i]);opSum(id)}
function opSum(id){const o=D.opnames.find(x=>x.id===id);const dl=o.lines.filter(l=>l.phys!==''&&l.phys!==l.sys);const val=dl.reduce((a,l)=>a+(l.phys-l.sys)*V(l.vid).cost,0);const miss=dl.filter(l=>!l.note).length;
 $('#opsum').innerHTML=`<div class="grid grid-cols-3 gap-2 text-[13px]"><div class="rounded-lg p-3" style="background:#F5F7FB">Item selisih<div class="font-bold text-lg">${dl.length}</div></div><div class="rounded-lg p-3" style="background:#F5F7FB">Nilai selisih (modal)<div class="font-bold text-lg num" style="color:${val<0?'var(--er)':'inherit'}">${rp(val)}</div></div><div class="rounded-lg p-3" style="background:${miss?'var(--wab)':'#F5F7FB'}">Tanpa penyebab<div class="font-bold text-lg">${miss}</div></div></div>`}
function opSubmit(id){const o=D.opnames.find(x=>x.id===id);if(o.lines.some(l=>l.phys!==''&&l.phys!==l.sys&&!l.note))return toast('Isi penyebab untuk setiap selisih');o.status='Menunggu';o.sub=D.user;save();toast('Opname diajukan ke Owner');opnameOpen(id);route();opnameOpen(id)}
function opDecide(id,ok){const o=D.opnames.find(x=>x.id===id);o.status=ok?'Disetujui':'Ditolak';o.by=D.user;
 if(ok)o.lines.forEach(l=>{if(l.phys!==''&&l.phys!==l.sys){const v=V(l.vid);const d=l.phys-l.sys;v.stock+=d;D.history.push({vid:l.vid,date:TODAY,type:'Stok',desc:`Stok opname ${o.id}: ${d>0?'+':''}${d} (${l.note})`,user:D.user})}});
 save();closeModal();toast(ok?'Stok disesuaikan':'Opname ditolak');route()}

/* REPORTS */
function hbars(rows,c='#04123F'){const mx=Math.max(...rows.map(r=>r[1]),1);return rows.map((r,i)=>`<div class="hb"><div class="flex justify-between text-[13px] mb-1.5"><span class="font-medium">${esc(r[0])}</span><span class="num font-semibold">${rp(r[1])}</span></div><div class="hbt"><div style="width:${r[1]/mx*100}%;background:${i===0?'#FEC40B':c}"></div></div></div>`).join('')}
function colBars(lbl,a,b){const mx=Math.max(...a,1);return `<div class="cb">${a.map((v,i)=>`<div class="cbc" title="${lbl[i]}: omzet ${rp(v)} · laba ${rp(b[i])}"><div class="cbb" style="height:${v/mx*100}%"><div class="cbl" style="height:${v?b[i]/v*100:0}%"></div></div><div class="cbx">${lbl[i].slice(0,2)}</div></div>`).join('')}</div><div class="flex gap-4 text-[11.5px] mt-3" style="color:var(--mu)"><span class="flex items-center gap-1.5"><i class="lg" style="background:#04123F"></i>Omzet</span><span class="flex items-center gap-1.5"><i class="lg" style="background:#FEC40B"></i>Laba</span></div>`}
const sec=(t,s,inner,cls='')=>`<div class="card p-5 ${cls}"><div class="mb-4"><div class="font-bold" style="color:var(--nv)">${t}</div>${s?`<div class="text-xs mt-0.5" style="color:var(--mu)">${s}</div>`:''}</div>${inner}</div>`;
const tblCard=(t,inner)=>`<div class="card overflow-hidden mt-4"><div class="px-5 pt-5 pb-3 flex justify-between items-center"><div class="font-bold" style="color:var(--nv)">${t}</div><span class="text-xs" style="color:var(--mu)">Detail</span></div><div class="tw">${inner}</div></div>`;
PAGES.report=()=>{const tab=state.rt||'sales',m=state.rm||TODAY.slice(0,7);
 const ms=D.sales.filter(s=>s.date.slice(0,7)===m);const T=a=>a.reduce((x,s)=>x+saleTotal(s),0),P=a=>a.reduce((x,s)=>x+saleProfit(s),0);
 const tabs=[['sales','Penjualan'],['profit','Laba per order'],['exp','Pengeluaran'],['purch','Pembelian supplier'],['stock','Stok'],['ar','Piutang']];
 let body='';
 if(tab==='sales'){const days=[...new Set(ms.map(s=>s.date))].sort().reverse();
  const asc=days.slice().reverse();body=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${kpiX('Omzet bulan',rp(T(ms)),ms.length+' transaksi','wallet','#9A6F00','#FFF4CC',null,'')}${kpiX('Laba bersih order',rp(P(ms)),'Margin '+Math.round(P(ms)/(T(ms)||1)*100)+'%','trend','#15803D','#E7F6EC',null,'')}${kpiX('Rata-rata/transaksi',rp(T(ms)/(ms.length||1)),'Nilai order','spark','#04123F','#E6EAF4',null,'')}${kpiX('Hari aktif',days.length+' hari','Rata-rata '+rp(T(ms)/(days.length||1))+'/hari','box','#04123F','#E6EAF4',null,'')}</div>${sec('Omzet & laba harian','Bagian gold menunjukkan porsi laba dari omzet',colBars(asc.map(d=>d.slice(8)),asc.map(d=>T(ms.filter(s=>s.date===d))),asc.map(d=>P(ms.filter(s=>s.date===d)))))}${tblCard('Rincian',`<table class="t"><thead><tr><th>Tanggal</th><th class="r">Transaksi</th><th class="r">Omzet</th><th class="r">Modal</th><th class="r">Biaya ops</th><th class="r">Laba</th></tr></thead><tbody>${days.map(d=>{const a=ms.filter(s=>s.date===d);return`<tr><td>${fd(d)}</td><td class="r">${a.length}</td><td class="r num">${rp(T(a))}</td><td class="r num">${rp(a.reduce((x,s)=>x+saleCost(s),0))}</td><td class="r num">${rp(a.reduce((x,s)=>x+saleOps(s),0))}</td><td class="r num font-semibold">${rp(P(a))}</td></tr>`}).join('')}</tbody></table>`)}`}
 if(tab==='profit'){const best=ms.slice().sort((a,b)=>saleProfit(b)-saleProfit(a))[0];const low=ms.filter(s=>saleProfit(s)<=0).length;body=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpiX('Total laba order',rp(P(ms)),ms.length+' order','trend','#15803D','#E7F6EC',null,'')}${kpiX('Margin rata-rata',Math.round(P(ms)/(T(ms)||1)*100)+'%','Laba ÷ penjualan','spark','#04123F','#E6EAF4',null,'')}${kpiX('Order terbaik',best?rp(saleProfit(best)):'-',best?best.id+' · '+esc(best.customer):'','wallet','#9A6F00','#FFF4CC',null,'')}${kpiX('Order laba ≤ 0',low+' order','Perlu cek harga / ongkir','box','#DC2626','#FDECEC',null,'')}</div>${tblCard('Rincian',`<table class="t"><thead><tr><th>Invoice</th><th>Pelanggan</th><th class="r">Penjualan</th><th class="r">Modal</th><th class="r">Ongkir</th><th class="r">Packing</th><th class="r">Lain</th><th class="r">Laba</th><th class="r">Margin</th></tr></thead><tbody>${ms.slice().reverse().map(s=>`<tr><td class="font-semibold">${s.id}</td><td>${esc(s.customer)}</td><td class="r num">${rp(saleSub(s))}</td><td class="r num">${rp(saleCost(s))}</td><td class="r num">${rp(s.ship)}</td><td class="r num">${rp(s.pack)}</td><td class="r num">${rp(s.other)}</td><td class="r num font-semibold" style="color:var(--ok)">${rp(saleProfit(s))}</td><td class="r">${Math.round(saleProfit(s)/saleSub(s)*100)}%</td></tr>`).join('')}<tr><td colspan="7" class="font-bold">Total</td><td class="r num font-bold">${rp(P(ms))}</td><td></td></tr></tbody></table>`)}`}
 if(tab==='exp'){const ops=ms.reduce((x,s)=>x+saleOps(s),0);const ex=D.expenses.filter(e=>e.date.slice(0,7)===m);const ship=ms.reduce((x,s)=>x+(+s.ship),0),pack=ms.reduce((x,s)=>x+(+s.pack),0);
  const rows=[['Ongkir (dari order)',ship],['Packing (dari order)',pack],['Biaya lain order',ops-ship-pack],...ex.map(e=>[e.cat,e.amt])];
  const tot=rows.reduce((a,r)=>a+r[1],0),gen=ex.reduce((a,e)=>a+e.amt,0);body=`<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-4">${kpiX('Total pengeluaran',rp(tot),rows.length+' kategori','wallet','#DC2626','#FDECEC',null,'')}${kpiX('Laba order',rp(P(ms)),'Sebelum biaya umum','trend','#15803D','#E7F6EC',null,'')}${kpiX('Estimasi laba bersih',rp(P(ms)-gen),'Laba order − biaya umum','spark','#04123F','#E6EAF4',null,'')}</div>${sec('Komposisi pengeluaran','Diurutkan dari yang terbesar',hbars(rows.slice().sort((a,b)=>b[1]-a[1])))}${tblCard('Rincian',`<table class="t"><thead><tr><th>Kategori pengeluaran</th><th class="r">Jumlah</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r num">${rp(r[1])}</td></tr>`).join('')}<tr><td class="font-bold">Total pengeluaran</td><td class="r num font-bold">${rp(rows.reduce((a,r)=>a+r[1],0))}</td></tr></tbody></table>`)}<div class="card p-4 mt-4 text-[13px] flex flex-wrap justify-between gap-2" style="background:#04123F;color:#fff;border:0"><span>Laba order ${rp(P(ms))} − biaya umum ${rp(gen)}</span><b class="num" style="color:#FEC40B">= ${rp(P(ms)-gen)}</b></div>`}
 if(tab==='purch'){const ps=D.purchases.filter(p=>p.date.slice(0,7)===m);const sups=[...new Set(ps.map(p=>p.supplier))];const ptot=p=>p.items.reduce((y,i)=>y+i.qty*i.cost,0);const sr=sups.map(s=>[s,ps.filter(p=>p.supplier===s).reduce((x,p)=>x+ptot(p),0)]).sort((a,b)=>b[1]-a[1]);
  body=`<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-4">${kpiX('Total pembelian',rp(sr.reduce((a,r)=>a+r[1],0)),ps.length+' nota','wallet','#9A6F00','#FFF4CC',null,'')}${kpiX('Supplier aktif',sups.length+' supplier','Periode ini','spark','#04123F','#E6EAF4',null,'')}${kpiX('Unit dibeli',ps.reduce((x,p)=>x+p.items.reduce((y,i)=>y+i.qty,0),0)+' unit','Masuk ke stok','box','#04123F','#E6EAF4',null,'')}</div>${sr.length?sec('Pembelian per supplier','Supplier terbesar ditandai gold',hbars(sr)):''}${tblCard('Rincian',`<table class="t"><thead><tr><th>Supplier</th><th class="r">Jumlah nota</th><th class="r">Total unit</th><th class="r">Total pembelian</th></tr></thead><tbody>${sups.map(s=>{const a=ps.filter(p=>p.supplier===s);return`<tr><td class="font-semibold">${esc(s)}</td><td class="r">${a.length}</td><td class="r">${a.reduce((x,p)=>x+p.items.reduce((y,i)=>y+i.qty,0),0)}</td><td class="r num">${rp(a.reduce((x,p)=>x+p.items.reduce((y,i)=>y+i.qty*i.cost,0),0))}</td></tr>`}).join('')||'<tr><td colspan="4" class="py-6 text-center" style="color:var(--mu)">Tidak ada pembelian pada periode ini</td></tr>'}</tbody></table>`)}`}
 if(tab==='stock'){const av=allV(),mc=av.reduce((a,v)=>a+v.stock*v.cost,0),mj=av.reduce((a,v)=>a+v.stock*v.price,0);body=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpiX('Total unit',av.reduce((a,v)=>a+v.stock,0)+' unit',av.length+' varian','box','#04123F','#E6EAF4',null,'')}${kpiX('Nilai modal',rp(mc),'Harga supplier','wallet','#9A6F00','#FFF4CC',null,'')}${kpiX('Nilai jual',rp(mj),'Harga customer','spark','#04123F','#E6EAF4',null,'')}${kpiX('Potensi laba',rp(mj-mc),av.filter(v=>v.stock<15).length+' varian menipis','trend','#15803D','#E7F6EC',null,'')}</div>${tblCard('Rincian',`<table class="t"><thead><tr><th>Barang</th><th class="r">Stok</th><th class="r">Nilai modal</th><th class="r">Nilai jual</th></tr></thead><tbody>${allV().map(v=>`<tr><td>${esc(v.pname)} · ${esc(v.name)}</td><td class="r">${v.stock}</td><td class="r num">${rp(v.stock*v.cost)}</td><td class="r num">${rp(v.stock*v.price)}</td></tr>`).join('')}<tr><td class="font-bold">Total</td><td class="r font-bold">${allV().reduce((a,v)=>a+v.stock,0)}</td><td class="r num font-bold">${rp(allV().reduce((a,v)=>a+v.stock*v.cost,0))}</td><td class="r num font-bold">${rp(allV().reduce((a,v)=>a+v.stock*v.price,0))}</td></tr></tbody></table>`)}`}
 if(tab==='ar'){const cs=[...new Set(D.sales.filter(s=>arStatus(s)!=='Lunas').map(s=>s.customer))];const op=D.sales.filter(s=>arStatus(s)!=='Lunas'),rem=a=>a.reduce((x,s)=>x+saleTotal(s)-salePaid(s),0);const cr=cs.map(c=>[c,rem(op.filter(s=>s.customer===c))]).sort((a,b)=>b[1]-a[1]);
  body=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${kpiX('Total piutang',rp(rem(op)),op.length+' tagihan','wallet','#04123F','#E6EAF4',null,'')}${kpiX('Terlambat',rp(rem(op.filter(s=>arStatus(s)==='Terlambat'))),op.filter(s=>arStatus(s)==='Terlambat').length+' tagihan','box','#DC2626','#FDECEC',null,'')}${kpiX('Jatuh tempo ≤3 hari',rp(rem(op.filter(s=>arStatus(s)==='Jatuh tempo'))),'Segera ditagih','spark','#B45309','#FEF3DC',null,'')}${kpiX('Pelanggan berutang',cs.length+' pelanggan','Tagihan aktif','trend','#9A6F00','#FFF4CC',null,'')}</div>${sec('Piutang per pelanggan','Pelanggan dengan sisa terbesar ditandai gold',hbars(cr))}${tblCard('Rincian',`<table class="t"><thead><tr><th>Pelanggan</th><th class="r">Tagihan terbuka</th><th class="r">Sisa piutang</th><th class="r">Terlambat</th></tr></thead><tbody>${cs.map(c=>{const a=D.sales.filter(s=>s.customer===c&&arStatus(s)!=='Lunas');return`<tr><td class="font-semibold">${esc(c)}</td><td class="r">${a.length}</td><td class="r num">${rp(a.reduce((x,s)=>x+saleTotal(s)-salePaid(s),0))}</td><td class="r num" style="color:var(--er)">${rp(a.filter(s=>arStatus(s)==='Terlambat').reduce((x,s)=>x+saleTotal(s)-salePaid(s),0))}</td></tr>`}).join('')}</tbody></table>`)}`}
 const months=[...new Set(D.sales.map(s=>s.date.slice(0,7)))].sort().reverse();
 return head('Laporan','Ringkasan bisnis otomatis dari transaksi, pembelian, dan stok.',`<select onchange="state.rm=this.value;route()">${months.map(x=>`<option value="${x}" ${x===m?'selected':''}>${new Date(x+'-01').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('')}</select><button class="btn" onclick="window.print()">Cetak</button>`)+
 `<div class="seg mb-5">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="state.rt='${t[0]}';route()">${t[1]}</button>`).join('')}</div><div class="rp">${body}</div>`};

/* APPROVAL */
PAGES.approval=()=>{const f=state.af||'Menunggu';const list=D.approvals.filter(a=>f==='Semua'||a.status===f).slice().reverse();
 const fmt=(a,v)=>a.field==='name'?esc(v):rp(v);
 return head('Approval & Audit Log','Perubahan nama varian, harga modal, dan harga jual tercatat lengkap sebelum & sesudah.')+
 `<div class="tabs mb-4">${['Menunggu','Disetujui','Ditolak','Semua'].map(x=>`<button class="${f===x?'on':''}" onclick="state.af='${x}';route()">${x} <span class="text-xs">(${x==='Semua'?D.approvals.length:D.approvals.filter(a=>a.status===x).length})</span></button>`).join('')}</div>
 <div class="card tw"><table class="t"><thead><tr><th>ID</th><th>Waktu</th><th>Perubahan</th><th>Barang</th><th>Sebelum</th><th>Sesudah</th><th>Diajukan</th><th>Status</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td class="font-semibold">${a.id}</td><td>${a.time}</td><td>${a.type}</td><td>${esc(vlabel(a.vid))}</td><td style="color:var(--mu)"><s>${fmt(a,a.before)}</s></td><td class="font-semibold">${fmt(a,a.after)}</td><td>${esc(a.user)}</td><td>${bd(a.status)}${a.by?`<div class="text-[11px] mt-0.5" style="color:var(--mu)">oleh ${esc(a.by)}</div>`:''}</td><td class="r">${a.status==='Menunggu'?`<button class="btn s d" onclick="decide('${a.id}',false)">Tolak</button> <button class="btn s p" onclick="decide('${a.id}',true)">Setujui</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="py-8 text-center" style="color:var(--mu)">Tidak ada data</td></tr>'}</tbody></table></div>`};
function decide(id,ok){const a=D.approvals.find(x=>x.id===id);a.status=ok?'Disetujui':'Ditolak';a.by=D.user;
 if(ok){const v=V(a.vid);v[a.field]=a.after;D.history.push({vid:a.vid,date:TODAY,type:a.field==='name'?'Nama':'Harga',desc:`${a.type}: ${a.field==='name'?a.before:rp(a.before)} → ${a.field==='name'?a.after:rp(a.after)}`,user:D.user})}
 save();toast(ok?'Perubahan disetujui & diterapkan':'Perubahan ditolak');route()}

 return head('Invoice','Template A4 — akan disesuaikan dengan contoh invoice dari customer.',`<select onchange="location.hash='invoice/'+this.value">${D.sales.slice().reverse().map(x=>`<option ${x.id===s.id?'selected':''}>${x.id}</option>`).join('')}</select><button class="btn p" onclick="window.print()">Cetak / Simpan PDF</button>`)+
 `<div class="invwrap"><div class="a4"><div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #FEC40B;padding-bottom:14px"><div style="display:flex;gap:12px;align-items:center"><div style="width:52px;height:52px;border-radius:12px;background:#04123F;color:#FEC40B;display:grid;place-items:center;font-weight:800;font-size:20px">RK</div><div><div style="font-weight:800;font-size:17px">${b.name}</div><div style="color:#555;line-height:1.5">${b.addr}<br>${b.phone} · ${b.email}<br>NPWP ${b.npwp}</div></div></div><div style="text-align:right"><div style="font-size:26px;font-weight:800;letter-spacing:.05em;color:#04123F">INVOICE</div><div style="margin-top:4px">${s.id}</div><div style="margin-top:8px;display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:11px;background:${st==='Lunas'?'#E7F6EC':st==='Terlambat'?'#fdecec':'#fdf3e1'};color:${st==='Lunas'?'#15803D':st==='Terlambat'?'#b91c1c':'#b45309'}">${st==='Lunas'?'LUNAS':'BELUM LUNAS'}</div></div></div>
 <div style="display:flex;justify-content:space-between;margin:18px 0"><div><div style="color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.08em">Ditagihkan kepada</div><div style="font-weight:700;font-size:14px;margin-top:3px">${esc(s.customer)}</div></div><div style="text-align:right;line-height:1.7"><span style="color:#777">Tanggal:</span> ${fd(s.date)}<br><span style="color:#777">Jatuh tempo:</span> ${s.due?fd(s.due):'Tunai'}<br><span style="color:#777">Pembayaran:</span> ${s.type==='tempo'?'Tempo':'Tunai'}</div></div>
 <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#F5F7FB">${['No','Barang','Qty','Harga','Jumlah'].map((h,i)=>`<th style="padding:8px;text-align:${i>1?'right':'left'};font-size:10.5px;text-transform:uppercase">${h}</th>`).join('')}</tr></thead><tbody>${s.items.map((i,k)=>`<tr style="border-bottom:1px solid #eee"><td style="padding:8px">${k+1}</td><td style="padding:8px">${esc(vlabel(i.vid))}</td><td style="padding:8px;text-align:right">${i.qty}</td><td style="padding:8px;text-align:right">${rp(i.price)}</td><td style="padding:8px;text-align:right">${rp(i.qty*i.price)}</td></tr>`).join('')}</tbody></table>
 <div style="display:flex;justify-content:flex-end;margin-top:14px"><div style="width:260px;line-height:2"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${rp(saleTotal(s))}</span></div><div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;border-top:2px solid #111;padding-top:4px"><span>Total</span><span>${rp(saleTotal(s))}</span></div><div style="display:flex;justify-content:space-between;color:#555"><span>Dibayar</span><span>${rp(salePaid(s))}</span></div><div style="display:flex;justify-content:space-between;font-weight:700"><span>Sisa tagihan</span><span>${rp(Math.max(saleTotal(s)-salePaid(s),0))}</span></div></div></div>
 <div style="margin-top:40px;display:flex;justify-content:space-between;align-items:flex-end"><div style="color:#555;line-height:1.6;font-size:11px"><b>Pembayaran transfer ke:</b><br>${b.bank}<br>Mohon cantumkan no. invoice saat transfer.</div><div style="text-align:center;width:160px"><div>Hormat kami,</div><div style="height:60px"></div><div style="border-top:1px solid #333;padding-top:4px;font-weight:600">${b.name}</div></div></div></div></div>`};

 `<div class="card tw mb-4"><table class="t"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${D.users.map((u,i)=>`<tr><td class="font-semibold"><span class="inline-grid place-items-center w-8 h-8 rounded-full mr-2 text-xs font-bold" style="background:var(--acs);color:var(--ac2)">${u.name.split(' ').map(x=>x[0]).join('')}</span>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select class="w-28" onchange="D.users[${i}].role=this.value;save();toast('Role diperbarui')" ${u.role==='Owner'?'disabled':''}>${['Owner','Admin','Staff'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><button onclick="D.users[${i}].active=!D.users[${i}].active;save();route()" class="bd ${u.active?'b-ok':'b-in'}">${u.active?'Aktif':'Nonaktif'}</button></td></tr>`).join('')}</tbody></table></div>

function userForm(){modal('Undang pengguna',`<div class="grid sm:grid-cols-3 gap-3"><div><label class="f">Nama</label><input id="un"></div><div><label class="f">Email</label><input id="ue" type="email"></div><div><label class="f">Role</label><select id="ur"><option>Staff</option><option>Admin</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" onclick="if(!$('#un').value)return toast('Isi nama');D.users.push({name:$('#un').value,email:$('#ue').value,role:$('#ur').value,active:true});save();closeModal();toast('Undangan disimulasikan');route()">Kirim undangan</button>`)}

function resetDemo(){if(confirm('Kembalikan semua data simulasi ke kondisi awal?')){try{localStorage.removeItem(KEY)}catch(e){};D=seed();save();state={};route();toast('Data demo direset')}}
route();

function areaChart(days,vals){const W=700,H=220,pl=46,pr=10,pt=14,pb=28;const mx=Math.ceil(Math.max(...vals,1)/1e6)*1e6||1e6;
 const x=i=>pl+i*(W-pl-pr)/(vals.length-1),y=v=>pt+(H-pt-pb)*(1-v/mx);
 const pts=vals.map((v,i)=>[x(i),y(v)]);let d=`M${pts[0][0]},${pts[0][1]}`;
 for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}
 const area=d+` L${x(vals.length-1)},${H-pb} L${pl},${H-pb} Z`;
 const grid=[0,.25,.5,.75,1].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(mx*t)}" y2="${y(mx*t)}" stroke="#EEF0F6" stroke-dasharray="4 4"/><text x="${pl-8}" y="${y(mx*t)+4}" text-anchor="end" font-size="10" fill="#697386">${(mx*t/1e6).toLocaleString('id-ID')} jt</text>`).join('');
 return `<div class="relative" id="chw"><div id="tip" class="ctip"></div><svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" style="overflow:visible"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEC40B" stop-opacity=".35"/><stop offset="1" stop-color="#FEC40B" stop-opacity="0"/></linearGradient><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#04123F"/><stop offset="1" stop-color="#04123F"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round"/>${pts.map((p,i)=>`<g class="pt" onmouseenter="chTip(this,${p[0]/W},${p[1]/H},'${fd(days[i])}','${rp(vals[i])}')" onmouseleave="$('#tip').style.opacity=0"><line x1="${p[0]}" x2="${p[0]}" y1="${pt}" y2="${H-pb}" class="vl" stroke="#04123F" stroke-dasharray="3 3"/><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#FEC40B" stroke="#04123F" stroke-width="2"/></g><text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="10" fill="#697386">${days[i].slice(8)}</text>`).join('')}</svg></div>`}
function chTip(g,x,y,d,v){const t=$('#tip');t.innerHTML=`<div class="text-[11px] opacity-70">${d}</div><div class="font-bold num">${v}</div>`;t.style.left=(x*100)+'%';t.style.top=(y*100)+'%';t.style.opacity=1}

</script>
